$kind: http-request
description: Retrieves the full details and live status of a ride.
url: "{{baseUrl}}/rides/{{rideId}}"
method: GET
headers:
  Authorization: Bearer {{riderToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Ride ID matches", function () {
          pm.expect(jsonData.id.toString()).to.eql(pm.environment.get("rideId").toString());
      });
    language: text/javascript
order: 2000
