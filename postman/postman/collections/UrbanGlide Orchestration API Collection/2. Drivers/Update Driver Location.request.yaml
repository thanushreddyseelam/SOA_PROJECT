$kind: http-request
description: Updates driver real-time GPS coordinates.
url: "{{baseUrl}}/drivers/{{driverId}}/location"
method: PUT
headers:
  Authorization: Bearer {{driverToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "latitude": 37.7750,
      "longitude": -122.4190
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
