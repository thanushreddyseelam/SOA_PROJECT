$kind: http-request
description: Queries payment record associated with completed ride.
url: "{{baseUrl}}/payments/ride/{{rideId}}"
method: GET
headers:
  Authorization: Bearer {{riderToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Payment is COMPLETED", function () {
          pm.expect(jsonData.status).to.be.oneOf(["COMPLETED", "SUCCESS", "PENDING"]);
      });
    language: text/javascript
order: 1000
