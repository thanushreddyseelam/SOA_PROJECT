$kind: http-request
description: Driver marks arrival at rider pickup location.
url: "{{baseUrl}}/rides/{{rideId}}/arrive"
method: PUT
headers:
  Authorization: Bearer {{driverToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Ride status is ARRIVED", function () {
          pm.expect(jsonData.status).to.be.oneOf(["ARRIVED", "DRIVER_ARRIVED"]);
      });
    language: text/javascript
order: 2000
