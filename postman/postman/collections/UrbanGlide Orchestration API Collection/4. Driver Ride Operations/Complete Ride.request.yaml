$kind: http-request
description: Driver completes the trip. Triggers automatic payment processing via Payment Service.
url: "{{baseUrl}}/rides/{{rideId}}/complete"
method: PUT
headers:
  Authorization: Bearer {{driverToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Ride status is COMPLETED", function () {
          pm.expect(jsonData.status).to.be.oneOf(["COMPLETED", "PAID", "TRIP_COMPLETED", "PAYMENT_PENDING"]);
      });
    language: text/javascript
order: 4000
