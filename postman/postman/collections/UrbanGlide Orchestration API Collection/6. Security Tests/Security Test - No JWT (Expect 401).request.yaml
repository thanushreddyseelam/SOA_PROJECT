$kind: http-request
description: Verifies that unauthenticated requests to protected endpoints return 401.
url: "{{baseUrl}}/rides/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
