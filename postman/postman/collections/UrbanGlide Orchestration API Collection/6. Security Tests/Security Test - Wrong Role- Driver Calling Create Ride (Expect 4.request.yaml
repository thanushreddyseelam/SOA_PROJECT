$kind: http-request
name: "Security Test - Wrong Role: Driver Calling Create Ride (Expect 403)"
description: Verifies that a Driver cannot book a ride on behalf of riders (403 Forbidden).
url: "{{baseUrl}}/rides"
method: POST
headers:
  Authorization: Bearer {{driverToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "riderId": 1,
      "pickupLocation": "Market St",
      "dropoffLocation": "Wharf",
      "pickupLatitude": 37.7749,
      "pickupLongitude": -122.4194,
      "dropoffLatitude": 37.8080,
      "dropoffLongitude": -122.4177,
      "vehicleType": "SEDAN",
      "paymentMethod": "CREDIT_CARD"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403 Forbidden", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 4000
