$kind: http-request
description: Verifies that malformed or invalid tokens are rejected with 401.
url: "{{baseUrl}}/rides/1"
method: GET
headers:
  Authorization: "{{bearer_token_13t6}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 2000
