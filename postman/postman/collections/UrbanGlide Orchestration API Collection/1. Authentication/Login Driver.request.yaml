$kind: http-request
description: Authenticates driver and retrieves JWT with DRIVER role claim.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "driver_dave",
      "password": "driver123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test("Returned role is DRIVER", function () {
          pm.expect(jsonData.role).to.eql("DRIVER");
      });
      if (jsonData.token) {
          pm.environment.set("driverToken", jsonData.token);
      }
      if (jsonData.userId) {
          pm.environment.set("driverId", jsonData.userId);
      }
    language: text/javascript
order: 4000
